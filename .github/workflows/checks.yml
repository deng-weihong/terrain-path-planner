name: Checks

on:
  push:
  pull_request:

jobs:
  python-and-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATH_PLANNER_NO_LOCAL_DATA: "1"
      PATH_PLANNER_REQUIRE_CPP: "1"
      PATH_PLANNER_TEST_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[web,test]'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev nlohmann-json3-dev
      - run: npm run build:cpp
      - run: npm run test:cpp
      - name: Install and consume native libraries
        run: |
          cmake --install build/cpp --prefix "$RUNNER_TEMP/terrain-planner-install"
          cmake -S cpp/examples/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/terrain-planner-install"
          cmake --build build/consumer --parallel 2
          ./build/consumer/consumer
          ./build/consumer/consumer-cli --input examples/native-request.json --output build/consumer/native-result.json
      - run: npm test
      - run: python examples/plan_route.py
      - run: npm run build
      - run: npm run benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run package:source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            artifacts/
            releases/
