name: Checks

on:
  push:
  pull_request:

jobs:
  python-and-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATH_PLANNER_NO_LOCAL_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[web,test]'
      - run: npm ci
      - run: npm test
      - run: python examples/plan_route.py
      - run: npm run build
      - run: npm run benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run package:source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            artifacts/
            releases/
